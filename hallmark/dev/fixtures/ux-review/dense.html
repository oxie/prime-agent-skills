<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Queue comparison</title>
<body><h1>Select a machine queue</h1><p>Compare pending jobs and expected wait.</p>
<form><fieldset><legend>Destination</legend>
<label><input type="radio" name="queue" value="A">A: 3 jobs, 8 min</label>
<label><input type="radio" name="queue" value="B">B: 5 jobs, 12 min</label>
<label><input type="radio" name="queue" value="C">C: 2 jobs, 6 min</label>
<label><input type="radio" name="queue" value="D">D: 6 jobs, 15 min</label>
<label><input type="radio" name="queue" value="E">E: 1 job, 4 min</label>
<label><input type="radio" name="queue" value="F">F: 4 jobs, 10 min</label>
<label><input type="radio" name="queue" value="G">G: 7 jobs, 18 min</label>
<label><input type="radio" name="queue" value="H">H: 0 jobs, 2 min</label>
</fieldset><button type="button">Prototype: no job will be sent</button></form>
</body></html>
