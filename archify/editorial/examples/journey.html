<style> :root { --paper: #17212b; --surface: #202d39; --ink: #f3f5f6; --muted: #bccad5; --rule: #657584; --accent: #ffbc8a; --accent-tint: #473425; --series: #a0bfd5; --figure-min-width: 640px; }
* { box-sizing: border-box; }
html { color-scheme: light; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; line-height: 1.5; }

figure { margin: 24px 0; }
.figure-scroll { overflow-x: auto; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); }

svg { display: block; width: 100%; min-width: var(--figure-min-width); height: auto; background: var(--surface); }

figcaption { margin-top: 16px; }
ul { padding-left: 24px; }
li { margin: 6px 0; }
table { border-collapse: collapse; width: 100%; margin: 12px 0; }
caption { text-align: left; font-weight: 700; padding: 8px 0; }

<main>
<header>
<p class="eyebrow">Archify · Synthetic journey example</p>
<h1>Booking is the hypothetical low point</h1>
<p>One fictional first-time workshop attendee. The line joins named feelings across stages; it does not measure emotion between them.</p>
</header>

</div>
<figcaption>
<h2>Equivalent stage notes</h2>
<ul>
<li><strong>Discover — Neutral.</strong> Find a workshop on the website.</li>
<li><strong>Choose — High.</strong> Compare sessions on the schedule.</li>
<li><strong>Book — Low.</strong> Enter details on a form. The imagined friction is its length.</li>
<li><strong>Attend — High.</strong> Join the session at the venue.</li>
</ul>
<p class="note">Synthetic scenario only. No interview, survey or behavior data supports these feelings. The outlined low-point marker and its incoming segment identify the proposed friction. Scroll the figure on narrow screens.</p>
